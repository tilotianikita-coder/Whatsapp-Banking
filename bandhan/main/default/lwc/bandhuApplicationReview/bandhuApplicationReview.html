<template>
    <div class="b-card b-spinner-host">
        <template lwc:if={loading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <template lwc:if={busy}>
            <lightning-spinner alternative-text="Recording decision" size="medium"></lightning-spinner>
        </template>

        <template lwc:if={error}>
            <div class="b-body"><div class="b-alert b-alert-error">{error}</div></div>
        </template>

        <template lwc:if={hasData}>
            <!-- header -->
            <div class="b-head">
                <div class="b-head-left">
                    <img class="b-logo" src={logoUrl} alt="Bandhan Bank" />
                    <div>
                    <div class="b-head-title">{app.Applicant_Name__c}</div>
                    <div class="b-head-sub">
                        {app.Reference_Number__c}
                        <template lwc:if={app.Channel__c}> · {app.Channel__c}</template>
                        <template lwc:if={app.Submitted_At__c}>
                            · Submitted <lightning-formatted-date-time value={app.Submitted_At__c} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                        </template>
                    </div>
                    </div>
                </div>
                <div class="b-head-right">
                    <span class={statusClass}>{app.Status__c}</span>
                    <button class="b-icon-btn" onclick={handleRefresh} title="Refresh">↻ Refresh</button>
                </div>
            </div>

            <div class="b-body">
                <!-- card art + quick facts -->
                <div class="top">
                    <template lwc:if={card}>
                        <template lwc:if={cardImage}>
                            <div class="b-cardimg"><img src={cardImage} alt="" /><template lwc:if={card.creditLimit}><span class="b-cf-limit b-cardimg-limit">{card.creditLimit}</span></template></div>
                        </template>
                        <template lwc:else>
                            <div class="b-cardface" style={cardStyle} title={card.tagline}>
                                <div class="b-cf-row"><img class="b-cf-logo" src={logoUrl} alt="" /><span class="b-cf-tier">{card.tierLabel}</span></div>
                                <div class="b-cf-chip"></div>
                                <div class="b-cf-row" style="align-items:flex-end">
                                    <div><div class="b-cf-small">CREDIT CARD</div><div class="b-cf-name">{card.name}</div></div>
                                    <template lwc:if={card.creditLimit}><span class="b-cf-limit">{card.creditLimit}</span></template>
                                </div>
                            </div>
                        </template>
                    </template>
                    <div class="b-tiles facts">
                        <div class="b-tile b-tile-main">
                            <div class="b-tile-label">CIBIL</div>
                            <div class="b-tile-value">{cibil}</div>
                            <div class="b-tile-sub">{cibilBand}</div>
                        </div>
                        <template lwc:if={hasScore}>
                            <div class="b-tile b-tile-sun">
                                <div class="b-tile-label">Bandhan Score</div>
                                <div class="b-tile-value">{app.Bandhan_Score__c}<span class="b-tile-sub"> /1000</span></div>
                                <div class="b-tile-sub">band {app.Score_Band__c}</div>
                            </div>
                        </template>
                        <div class="b-tile">
                            <div class="b-tile-label">Declared income</div>
                            <div class="b-tile-value">{declaredIncome}</div>
                            <div class="b-tile-sub">per month</div>
                        </div>
                        <div class="b-tile">
                            <div class="b-tile-label">Verified income</div>
                            <div class="b-tile-value">{verifiedIncome}</div>
                            <div class="b-tile-sub">per month</div>
                        </div>
                        <div class="b-tile">
                            <div class="b-tile-label">Customer</div>
                            <div class="b-tile-value small">{customerType}</div>
                        </div>
                    </div>
                </div>

                <!-- Agentforce: the underwriting brief (advisory) -->
                <div class="b-section">
                    <div class="b-section-title">AI underwriting brief · Agentforce</div>
                    <div class="brief">
                        <template lwc:if={hasBrief}>
                            <div class="brief-body">
                                <template for:each={briefLines} for:item="l"><div key={l.key} class={l.cls}>{l.text}</div></template>
                            </div>
                            <div class="b-muted brief-foot">Written by Einstein (Prompt Builder: Bandhu Underwriter Brief) from this page's facts<template lwc:if={briefAt}> · <lightning-formatted-date-time value={briefAt} month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></template>. Advisory: the rules and you decide.</div>
                        </template>
                        <template lwc:else>
                            <div class="b-muted">Get a summary of this application with its strengths, concerns and a suggested decision.</div>
                        </template>
                        <button class="b-btn-navy brief-btn" onclick={handleBrief} disabled={briefBusy}>
                            <template lwc:if={briefBusy}>Writing…</template>
                            <template lwc:elseif={hasBrief}>↻ Regenerate</template>
                            <template lwc:else>✨ Generate brief</template>
                        </button>
                    </div>
                </div>

                <!-- Account Aggregator: what the bank statements show -->
                <template lwc:if={cf}>
                    <div class="b-section">
                        <div class="b-section-title">Bank statements · Account Aggregator</div>
                        <div class="b-muted aa-meta">
                            Consent {cf.consentId} · purpose: {cf.purpose} · {cf.months} months ({cf.period}) · {cf.banks} banks, {cf.accounts} accounts, {cf.transactions} transactions
                        </div>
                        <div class="b-tiles aa-tiles">
                            <div class="b-tile b-tile-main">
                                <div class="b-tile-label">Net monthly income</div>
                                <div class="b-tile-value">{cf.netIncome}</div>
                                <div class="b-tile-sub">{cf.incomeSource}<template lwc:if={cf.declaredIncome}> · declared {cf.declaredIncome}</template></div>
                            </div>
                            <div class="b-tile">
                                <div class="b-tile-label">Income stability</div>
                                <div class="b-tile-value">{cf.stability}<span class="b-tile-sub"> /100</span></div>
                                <div class="b-bar"><div class="b-bar-fill" style={stabilityBar}></div></div>
                                <div class="b-tile-sub">{cf.trend} · {cf.growth}</div>
                            </div>
                            <div class="b-tile">
                                <div class="b-tile-label">EMIs (FOIR)</div>
                                <div class="b-tile-value">{cf.foir}%</div>
                                <div class="b-tile-sub">{cf.emi} a month</div>
                            </div>
                            <div class="b-tile">
                                <div class="b-tile-label">Monthly surplus</div>
                                <div class="b-tile-value">{cf.surplus}</div>
                                <div class="b-tile-sub">outflow {cf.outflow}<template lwc:if={cf.avgBalance}> · avg balance {cf.avgBalance}</template></div>
                            </div>
                        </div>
                        <!-- where the money goes: one thin segmented bar, the card-able part highlighted, figures in the list -->
                        <div class="aa-sub">Where the money goes · {cf.outflow} a month</div>
                        <div class="ob" role="img" aria-label={outflowLabel}>
                            <template for:each={outflowParts} for:item="o">
                                <span key={o.category} class={o.segCls} style={o.segStyle} title={o.tip}></span>
                            </template>
                        </div>
                        <ul class="ob-legend">
                            <template for:each={outflowParts} for:item="o">
                                <li key={o.category} class={o.itemCls}><span class={o.swCls} style={o.swStyle}></span><span class="ob-name">{o.category}</span><span class="ob-amt">{o.amount}</span><span class="b-muted">{o.pct}%</span></li>
                            </template>
                        </ul>
                        <template lwc:if={cf.declaredSpend}>
                            <div class="said">
                                <div class="said-cell"><div class="b-tile-label">Said they'd spend on the card</div><div class="said-val">{cf.declaredSpend}<span class="b-tile-sub"> a month</span></div></div>
                                <div class="said-vs">vs</div>
                                <div class="said-cell"><div class="b-tile-label">Card-able spend in the statements</div><div class="said-val">{cf.cardSpend}<span class="b-tile-sub"> a month</span></div></div>
                            </div>
                        </template>

                        <div class="aa-cols">
                            <div>
                                <div class="aa-sub">Card-able spend by category · {cf.cardSpend} a month</div>
                                <template for:each={cf.spend} for:item="row">
                                    <div key={row.category} class="spend-row">
                                        <span class="spend-cat">{row.category}</span>
                                        <span class="spend-bar"><span class="spend-fill" style={row.barStyle}></span></span>
                                        <span class="spend-amt">{row.amount}</span>
                                        <span class="b-muted spend-pct">{row.pct}%</span>
                                    </div>
                                </template>
                            </div>
                            <div>
                                <template lwc:if={hasLifestyle}>
                                    <div class="aa-sub">Lifestyle signals</div>
                                    <ul class="b-why"><template for:each={cf.lifestyle} for:item="l"><li key={l}>{l}</li></template></ul>
                                </template>
                                <template lwc:if={cf.seasonality}><div class="aa-sub">Seasonality</div><div>{cf.seasonality}</div></template>
                                <div class="aa-sub">Flags</div>
                                <template lwc:if={hasAnomalies}>
                                    <ul class="flags"><template for:each={cf.anomalies} for:item="a"><li key={a}>⚠ {a}</li></template></ul>
                                </template>
                                <template lwc:else><div class="b-pill b-pill-green">No unexplained credits, round-trip transfers or income gaps</div></template>
                                <template lwc:if={cf.spendGapFlag}>
                                    <ul class="flags slds-m-top_x-small"><li>⚠ {cf.spendGapFlag}</li></ul>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
                <template lwc:else>
                    <div class="b-section">
                        <div class="b-section-title">Bank statements · Account Aggregator</div>
                        <div class="b-alert b-alert-info">No Account Aggregator data on this application<div class="b-alert-sub">The customer skipped connecting their accounts, or is an existing customer (income from the bank's salary credits).</div></div>
                    </div>
                </template>

                <!-- Bandhan Score: hero figure + band meter, where the points come from, strengths vs gaps, all factors -->
                <template lwc:if={score}>
                    <div class="b-section">
                        <div class="b-section-title">Bandhan Score</div>
                        <div class="sc">
                            <div class="sc-hero">
                                <div class="sc-num">{score.score}<span class="sc-of">/1000</span></div>
                                <span class={bandPillClass}>Band {score.band} · {bandMeaning}</span>
                                <div class="b-muted sc-note">Bandhan's own score, separate from CIBIL ({cibil}). {score.model}.</div>
                            </div>
                            <div class="sc-meter-wrap">
                                <div class="sc-meter" role="img" aria-label={meterLabel}>
                                    <span class="z zd" title="Band D, under 400: manual review"></span>
                                    <span class="z zc" title="Band C, 400-549: limit 0.5x lower"></span>
                                    <span class="z zb" title="Band B, 550-699: standard limit"></span>
                                    <span class="z za" title="Band A, 700+: limit 0.5x higher"></span>
                                    <span class="sc-marker" style={markerStyle} title={meterLabel}></span>
                                </div>
                                <div class="sc-scale"><span>0</span><span style="left:40%">400</span><span style="left:55%">550</span><span style="left:70%">700</span><span style="left:100%">1000</span></div>
                                <div class="sc-zones"><span style="left:20%">D · review</span><span style="left:47.5%">C</span><span style="left:62.5%">B</span><span style="left:85%">A · +0.5x limit</span></div>
                            </div>
                        </div>

                        <div class="sc-grid">
                            <div>
                                <div class="aa-sub">Where the points come from</div>
                                <template for:each={scoreGroups} for:item="g">
                                    <div key={g.name} class="grp" title={g.tip}>
                                        <div class="grp-head"><span class="grp-name">{g.name}</span><span class="grp-pts"><b>{g.points}</b> / {g.max}</span></div>
                                        <div class="grp-track"><span class="grp-fill" style={g.style}></span></div>
                                        <div class="b-muted grp-sub">{g.sub}</div>
                                    </div>
                                </template>
                            </div>
                            <div>
                                <div class="aa-sub">Strengths</div>
                                <ul class="pts-list">
                                    <template for:each={strengths} for:item="f">
                                        <li key={f.name}><span class="ico ok">✓</span><span class="pl-name">{f.name}</span><span class="pl-val">{f.value}</span><span class="pl-pts">{f.points}/{f.maxPoints}</span></li>
                                    </template>
                                </ul>
                                <div class="aa-sub">Holding the score back</div>
                                <template lwc:if={hasGaps}>
                                    <ul class="pts-list">
                                        <template for:each={gaps} for:item="f">
                                            <li key={f.name}><span class="ico gap">↓</span><span class="pl-name">{f.name}</span><span class="pl-val">{f.value}</span><span class="pl-lost">−{f.lost} pts</span></li>
                                        </template>
                                    </ul>
                                </template>
                                <template lwc:else><div class="b-muted">Nothing: every factor at its maximum.</div></template>
                            </div>
                        </div>

                        <lightning-accordion allow-multiple-sections-open class="slds-m-top_small" active-section-name="">
                            <lightning-accordion-section name="all" label="All 14 factors (the audit log for this decision)">
                                <table class="ft">
                                    <thead><tr><th>Factor</th><th>Value</th><th>Source</th><th class="ft-bar-h">Points</th><th class="num">Earned</th></tr></thead>
                                    <tbody>
                                        <template for:each={factorRows} for:item="f">
                                            <tr key={f.name}>
                                                <td class="ft-name">{f.name}</td>
                                                <td>{f.value}</td>
                                                <td class="b-muted">{f.source}</td>
                                                <td><span class="grp-track sm"><span class={f.fillCls} style={f.barStyle}></span></span></td>
                                                <td class="num"><b>{f.points}</b>/{f.maxPoints}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </lightning-accordion-section>
                        </lightning-accordion>
                    </div>
                </template>

                <!-- stage gates -->
                <div class="b-section">
                    <div class="b-section-title">Stage gates</div>
                    <div class="gates">
                        <template for:each={gates} for:item="g">
                            <button key={g.key} class={g.cls} data-key={g.key} title={g.title} onclick={handleGate}>{g.label}</button>
                        </template>
                    </div>
                    <div class="legend b-muted">
                        <span class="dot dot-pass"></span>Pass <span class="dot dot-refer"></span>Refer <span class="dot dot-fail"></span>Fail <span class="dot dot-pending"></span>Pending
                    </div>
                    <template lwc:if={selected}>
                        <div class="gate-detail">
                            <div class="gate-detail-head">
                                <span class="gate-detail-title">{selected.label}</span>
                                <span class={selected.resultClass}>{selected.result}</span>
                                <template lwc:if={selected.hasScore}><span class="b-pill b-pill-orange">Score {selected.score}</span></template>
                                <template lwc:if={selected.provider}><span class="b-muted">via {selected.provider}</span></template>
                            </div>
                            <div class="gate-summary">{selected.summary}</div>
                            <template lwc:if={hasSelectedLines}>
                                <ul class="b-list">
                                    <template for:each={selected.lines} for:item="l"><li key={l.key}>{l.text}</li></template>
                                </ul>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- recommendation -->
                <div class="b-section">
                    <div class="b-section-title">Recommendation</div>
                    <div class="rec-row">
                        <span class={recommendationClass}>{app.Recommendation__c}</span>
                        <ul class="b-list reasons">
                            <template for:each={reasonItems} for:item="r"><li key={r.key}>{r.text}</li></template>
                        </ul>
                    </div>
                    <dl class="b-kv slds-m-top_small">
                        <template lwc:if={review.why}><dt>Why this card</dt><dd><ul class="b-why"><template for:each={whyItems} for:item="w"><li key={w.key}>{w.text}</li></template></ul></dd></template>
                        <template lwc:if={review.needs}><dt>Customer needs</dt><dd>{review.needs}</dd></template>
                        <template lwc:if={review.eligible}><dt>Eligible cards</dt><dd>{review.eligible}</dd></template>
                    </dl>
                </div>

                <!-- decision -->
                <div class="b-section">
                    <template lwc:if={decided}>
                        <div class={outcomeClass}>
                            {outcomeText}
                            <div class="b-alert-sub">
                                By {decisionBy}
                                <template lwc:if={app.Decision_At__c}>
                                    on <lightning-formatted-date-time value={app.Decision_At__c} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                </template>
                                <template lwc:if={app.Decision_Notes__c}><br />Notes: {app.Decision_Notes__c}</template>
                            </div>
                        </div>
                    </template>
                    <template lwc:elseif={withApprover}>
                        <div class="b-alert b-alert-warn">
                            {withApproverText}
                            <div class="b-alert-sub">See <b>Upgrade or higher limit</b> below for the request and its status.</div>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="decision-bar">
                            <div class="b-muted">This application needs an underwriter decision.</div>
                            <div class="b-footer">
                                <button class="b-btn" onclick={handleDecline} disabled={busy}>✕ Decline</button>
                                <button class="b-btn-green" onclick={handleApprove} disabled={busy}>✓ Approve &amp; issue card</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
