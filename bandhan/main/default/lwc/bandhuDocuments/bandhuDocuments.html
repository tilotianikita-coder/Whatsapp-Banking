<template>
    <div class="b-card b-spinner-host">
        <div class="b-head">
            <div class="b-head-left">
                <img class="b-logo" src={logoUrl} alt="Bandhan Bank" />
                <div>
                    <div class="b-head-title">Income documents</div>
                    <div class="b-head-sub">Salary slip · Form 16 · ITR · bank statement: read and cross-checked</div>
                </div>
            </div>
            <div class="b-head-right"><span class="b-pill b-pill-white">{countText}</span></div>
        </div>
        <div class="b-body">
            <div class="up">
                <lightning-combobox class="type" label="Document type" value={docType} options={typeOptions} onchange={handleType}></lightning-combobox>
                <lightning-file-upload label="File" record-id={recordId} accept=".pdf,.png,.jpg,.jpeg" onuploadfinished={handleUploadFinished}></lightning-file-upload>
                <div class="b-muted hint">Read by OCR (mock) and checked against the declared income: more than 15% below, or a PAN mismatch, refers.</div>
            </div>
            <template lwc:if={busy}><lightning-spinner size="small" alternative-text="Reading"></lightning-spinner></template>
            <template lwc:if={hasDocs}>
                <ul class="docs">
                    <template for:each={docs} for:item="d">
                        <li key={d.Id} class="doc">
                            <span class={d.badge}>{d.Result__c}</span>
                            <div class="doc-main">
                                <div class="doc-title">{d.Type__c} <span class="b-muted">· {d.Period__c}</span></div>
                                <div class="b-muted">{d.Summary__c}</div>
                            </div>
                            <div class="doc-side">
                                <div class="doc-income">{d.income}</div>
                                <div class={d.panClass}>{d.pan}</div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
        </div>
    </div>
</template>
