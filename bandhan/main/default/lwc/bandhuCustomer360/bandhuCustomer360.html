<template>
    <lightning-card title="Bandhu: customer 360 and card to pitch" icon-name="standard:customer_360">
        <div class="slds-p-horizontal_medium">
            <template lwc:if={error}><p class="slds-text-color_error">{error}</p></template>
            <template lwc:if={view}>
                <template lwc:if={view.isCustomer}>
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-3"><div class="slds-text-title">Tier</div><div class="slds-text-heading_small">{view.tier}</div></div>
                        <div class="slds-col slds-size_1-of-3"><div class="slds-text-title">Relationship</div><div class="slds-text-heading_small">{view.relationshipScore}/100</div></div>
                        <div class="slds-col slds-size_1-of-3"><div class="slds-text-title">Bandhan Score</div><div class="slds-text-heading_small">{scoreText}</div></div>
                    </div>
                    <template lwc:if={view.hold}>
                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_small" role="alert">On hold: {view.hold}</div>
                    </template>
                    <template lwc:if={view.pitchCard}>
                        <div class="slds-box slds-theme_shade slds-m-top_small">
                            <div class="slds-text-title_caps">Pitch</div>
                            <div class="slds-text-heading_medium">Bandhan {view.pitchCard}</div>
                            <div class="slds-text-body_small slds-text-color_weak">{view.pitchTagline}</div>
                            <div class="slds-m-top_x-small">Limit: <b>{view.pitchLimit}</b></div>
                            <ul class="slds-m-top_x-small">
                                <template for:each={view.pitchWhy} for:item="w"><li key={w}>{w}</li></template>
                            </ul>
                            <template lwc:if={view.alternative}><div class="slds-text-body_small slds-m-top_x-small">Also a fit: {view.alternative}</div></template>
                        </div>
                    </template>
                    <template lwc:if={view.notEligibleReason}><p class="slds-m-top_small">Not eligible: {view.notEligibleReason}</p></template>
                    <div class="slds-m-top_small slds-text-body_small">
                        <div><b>Eligible:</b> {eligibleText} · {weakestText}</div>
                        <template lwc:if={view.bureau}><div><b>Bureau:</b> {view.bureau}</div></template>
                        <template lwc:if={view.cashFlow}><div><b>Cash flow (AA):</b> {view.cashFlow}</div></template>
                    </div>
                    <lightning-accordion allow-multiple-sections-open class="slds-m-top_small">
                        <lightning-accordion-section name="rel" label="Relationship detail">
                            <template for:each={view.relationship} for:item="l"><div key={l} class="slds-text-body_small">{l}</div></template>
                        </lightning-accordion-section>
                        <lightning-accordion-section name="bureau" label="Bureau report">
                            <template for:each={view.bureauLines} for:item="l"><div key={l} class="slds-text-body_small">{l}</div></template>
                        </lightning-accordion-section>
                        <template lwc:if={hasHistory}>
                            <lightning-accordion-section name="hist" label="Card applications">
                                <template for:each={view.history} for:item="l"><div key={l} class="slds-text-body_small">{l}</div></template>
                            </lightning-accordion-section>
                        </template>
                    </lightning-accordion>
                    <div class="slds-m-top_small">
                        <lightning-button variant="brand" label="Start branch-assisted application" onclick={handleStart} disabled={cannotStart}></lightning-button>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak">Not a Bandhan Bank customer yet (no relationship on file): new-to-bank customers apply on WhatsApp or the web.</p>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
